<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon referencing site img folder relative to pages/ -->
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <style>
        :root {
            --bg-color: #5c473c;
            --accent-orange: #ff7a18;
            --line-color: #789988;
            --card-bg: rgba(0, 0, 0, 0.15);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Navigation Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-orange);
            margin: 0;
            font-size: 28px;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Responsive Table Container */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Direct Web URLs & AI Directory Table */
        .ai-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: var(--card-bg);
            font-size: 13.5px;
        }

        .ai-table th {
            background-color: rgba(0, 0, 0, 0.35);
            color: var(--accent-orange);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--line-color);
            white-space: nowrap;
        }

        .ai-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            line-height: 1.45;
        }

        .ai-table tr:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        /* Formatted Subtext & Links */
        .subtext {
            display: block;
            font-size: 11.5px;
            color: #d1c4bc;
            font-style: italic;
            margin-top: 4px;
        }

        .url-link {
            color: #ffaa5e;
            text-decoration: none;
            word-break: break-all;
            font-family: monospace;
        }

        .url-link:hover {
            text-decoration: underline;
        }

        .risk-badge {
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        .risk-low { color: #81c784; }
        .risk-mod { color: #ffb74d; }
        .risk-high { color: #e57373; }
    </style>
</head>

        function renderDirectory() {
            const tbody = document.getElementById("ai-table-body");

            aiDirectoryData.forEach(item => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td><strong>${item.region}</strong></td>
                    <td><strong>${item.name}</strong></td>
                    <td><a href="${item.url}" target="_blank" rel="noopener noreferrer" class="url-link">${item.url}</a></td>
                    <td>
                        <strong>${item.company}</strong>
                        <span class="subtext">${item.status}</span>
                    </td>
                    <td>${item.tech}</td>
                    <td>

                        <span class="subtext">${item.riskDetails}</span>
                    </td>
                    <td>${item.features}</td>

                tbody.appendChild(tr);

        }

        renderDirectory();
